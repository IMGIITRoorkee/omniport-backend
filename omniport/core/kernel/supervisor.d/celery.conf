[program:celery]
# Every queue an app declares in a task decorator must appear here. A task
# routed to a queue absent from this list is accepted and then never consumed.
command=celery -A omniport worker -l info -Q celery,emails,notifications,publish_results,resume_generate,scorecard_generate,shp_publish,update_phd_profiles

autorestart=true
startretries=3

# Without these, stopping the worker leaves its pool children running as
# orphans that hold memory and consume nothing.
stopasgroup=true
killasgroup=true

stdout_logfile=/web_server_logs/supervisord_logs/celery-%(ENV_SITE_ID)s-stdout.log
stdout_logfile_maxbytes=1048576
stdout_logfile_backups=32

stderr_logfile=/web_server_logs/supervisord_logs/celery-%(ENV_SITE_ID)s-stderr.log
stderr_logfile_maxbytes=1048576
stderr_logfile_backups=32
