name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  dependencies:
    name: Dependency advisory tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        # The interpreter the django image ships, so the gate runs where the
        # code does.
        python-version: '3.10'

    - name: Run the test suite
      run: python -m unittest discover --start-directory tests --verbose

    - name: Install Poetry
      run: pipx install poetry==1.8.5

    # Catches a pyproject.toml edited without re-locking, which would leave
    # the constraint and the installed version disagreeing.
    - name: Check the lock file matches pyproject.toml
      run: poetry check --lock
